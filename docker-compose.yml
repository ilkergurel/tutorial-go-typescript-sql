name: stacklab

# Version pinning lives in exactly one place (CLAUDE.md "Versions" table).
# NOTE: Compose can only interpolate ${VAR} from the environment / .env — NOT
# from YAML anchors or extension fields like x-versions (those produced the
# literal-garbled "postgres:versions.pg_major:-18-alpine" error). So versions
# are plain env vars with defaults here; override via .env (see .env.example).
# PG_MAJOR keeps the Postgres major version a one-line bump (owner decision:
# always latest stable; 19 GA is 2026-11-19).

services:
  app-db:
    image: postgres:${PG_MAJOR:-18}-alpine
    environment:
      POSTGRES_USER: stacklab
      POSTGRES_PASSWORD: stacklab
      POSTGRES_DB: stacklab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ images moved PGDATA to /var/lib/postgresql/<major>/docker; mounting
      # the pre-18 path makes the container exit(1) at initdb.
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacklab -d stacklab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  playground-db:
    image: postgres:${PG_MAJOR:-18}-alpine
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PG 18+ images moved PGDATA to /var/lib/postgresql/<major>/docker.
      - playground-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - runner-net

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27.4}
        SERVICE: stacklab
    environment:
      STACKLAB_HTTP_HOST: 0.0.0.0
      STACKLAB_HTTP_PORT: "8080"
      STACKLAB_DATABASE_URL: postgres://stacklab:stacklab@app-db:5432/stacklab
      STACKLAB_RUNNER_URL: http://runner:8090
      STACKLAB_LOG_FORMAT: text
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      # default is the backend's only non-internal network. It is what makes
      # the published 8080 reachable (Docker publishes nothing for a container
      # that sits on internal networks only), gives the backend its outbound
      # path (ADR-0003), and lets the frontend's dev proxy reach it by name.
      - default
      - backend-net
      - runner-net

  frontend:
    image: node:${NODE_VERSION:-22}-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # The browser calls /api on :5173 and Vite proxies it here, so requests
      # stay same-origin; the backend sends no CORS headers, so a direct
      # browser call to :8080 would be blocked.
      STACKLAB_API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  # Internal network members (runner, playground-db, mocksvc) have no internet
  # access and no published ports except where the owner inspects them directly.

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27.4}
        NODE_VERSION: ${NODE_VERSION:-22}
    command: ["runner"]
    environment:
      STACKLAB_RUNNER_DATABASE_URL: postgres://playground:playground@playground-db:5432/playground
    depends_on:
      playground-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /work:uid=65532,gid=65532
    user: "65532:65532"
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    networks:
      - runner-net
      - backend-net

  mocksvc:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27.4}
        # server/Dockerfile builds ./cmd/${SERVICE}; without this the image
        # holds the backend binary (ENTRYPOINT ignores any `command`).
        SERVICE: mocksvc
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    mem_limit: 128m
    networks:
      - runner-net
      - backend-net

volumes:
  app-db-data:
  playground-db-data:

networks:
  backend-net:
    internal: true
  runner-net:
    internal: true
